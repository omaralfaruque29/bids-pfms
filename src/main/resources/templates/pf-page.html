<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">

<head>
   <meta charset="UTF-8">
   <title>Bootstrap Row Column Table</title>

   <!-- Bootstrap CSS -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container">

   <!-- Row with margin -->
   <div class="row mt-5">

      <!-- Column centered with margin -->
      <div class="col-md-10 mx-auto">

         <h4 class="mb-3 text-center">Statement of GPF Contribution</h4>

         <div th:inline="text">
            <!--
            Employee ID:[[${empID}]] </br>
            Name:[[${employeeName}]] </br>
            Designation:[[${designation}]] </br>
            Period:[[${period}]] </br>
            GPF A/C No:[[${GPFAccountNo}]] </br>
            -->

            <table class="table table-sm table-borderless text-center">
            <tbody>
            <tr><td>Employee ID : [[${empID}]]</td></tr>
            <tr><td>Employee Name : [[${employeeName}]]</td></tr>
            <tr><td>Designation : [[${designation}]]</td></tr>
            <tr><td>Period : [[${period}]]</td></tr>
            <tr><td>GPF Account Number : [[${GPFAccountNo}]]</td></tr>
            </tbody>
            </table>

         </div>

         <!-- Table -->
         <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle text-center">
               <thead class="table-secondary">
               <tr>
                  <th>Serial No.</th>
                  <th>Description</th>
                  <th>Amount</th>
               </tr>
               </thead>
               <tbody>
               <tr>
                  <td>1</td>
                  <td th:text="${t1}"></td>
                  <td th:text="${t11}"></td>
               </tr>
               <tr>
                  <td>2</td>
                  <td th:text="${t2}"></td>
                  <td th:text="${t21}"></td>
               </tr>
               <tr>
                  <td>3</td>
                  <td th:text="${t3}"></td>
                  <td th:text="${t31}"></td>
               </tr>
               <tr>
                  <td>4</td>
                  <td th:text="${t4}"></td>
                  <td th:text="${t41}"></td>
               </tr>
               <tr>
                  <td>5=sum(1:4)</td>
                  <td th:text="${t5}"></td>
                  <td th:text="${t51}"></td>
               </tr>
               <tr>
                  <td>6</td>
                  <td th:text="${t6}"></td>
                  <td th:text="${t61}"></td>
               </tr>
               <tr>
                  <td>7=(5-6)</td>
                  <td th:text="${t7}"></td>
                  <td th:text="${t71}"></td>
               </tr>
               </tbody>
            </table>
         </div>

      </div>
   </div>

</div>

</body>
</html>
